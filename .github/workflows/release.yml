name: Release tag
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - name: Validate release tag and create GitHub release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 scripts/release.py check --tag "$RELEASE_TAG"
          if ! gh release view "$RELEASE_TAG"; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Prism $RELEASE_TAG" --generate-notes
          fi
  publish:
    needs: github-release
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ github.ref_name }}
      expected-sha: ${{ github.sha }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    permissions:
      contents: write
