name: Publish crates
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version, without the v prefix
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/v${{ inputs.version }}
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: rustup component add rustfmt clippy
      - name: Verify release version and existing GitHub release
        env:
          RELEASE_TAG: v${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py check --tag "$RELEASE_TAG"
          gh release view "$RELEASE_TAG"
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python3 scripts/verify-packages.py
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 scripts/release.py publish
