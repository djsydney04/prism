name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      maintenance_smoke:
        description: Test Pi with the selected provider in a disposable Rust fixture
        required: false
        default: false
        type: boolean
      maintenance_smoke_provider:
        description: Provider for the optional live diagnostic
        required: false
        default: google
        type: choice
        options:
          - google
          - groq
          - openai
          - anthropic
      maintenance_smoke_model:
        description: Model for the optional diagnostic (blank uses provider default)
        required: false
        default: ''
        type: string
      maintenance_smoke_allow_paid:
        description: Explicitly allow paid inference for this diagnostic
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  maintenance-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.maintenance_smoke && github.repository == 'djsydney04/prism'
    name: Maintenance agent live smoke test
    uses: djsydney04/repo_maintainer/.github/workflows/smoke.yml@610da64180574028e70273ce55b7495fb7908b41
    with:
      maintainer_ref: 610da64180574028e70273ce55b7495fb7908b41
      provider: ${{ inputs.maintenance_smoke_provider }}
      model: ${{ inputs.maintenance_smoke_model }}
      allow_paid: ${{ inputs.maintenance_smoke_allow_paid }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SDK_MAINTENANCE_API_KEY: ${{ secrets.SDK_MAINTENANCE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  checks:
    if: ${{ !inputs.maintenance_smoke }}
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
  msrv:
    if: ${{ !inputs.maintenance_smoke }}
    name: Rust 1.88 minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --workspace --all-targets --locked
  package:
    if: ${{ !inputs.maintenance_smoke }}
    name: Verify crate packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: python3 scripts/verify-packages.py
  audit:
    if: ${{ !inputs.maintenance_smoke }}
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
  release-tooling:
    if: ${{ !inputs.maintenance_smoke }}
    name: Release tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Historical SDK tags may predate these tests; validate the publisher itself.
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/tests -v
  required:
    name: CI required
    if: ${{ always() && !inputs.maintenance_smoke }}
    needs: [checks, msrv, package, audit, release-tooling]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in jobs.items() if job["result"] != "success"]
          if failed:
              raise SystemExit("Required CI jobs did not pass: " + ", ".join(failed))
          PY
