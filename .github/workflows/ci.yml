name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      maintenance_smoke:
        description: Test the maintenance coding agent with the free-tier Gemini key
        required: false
        default: false
        type: boolean
      maintenance_smoke_model:
        description: Free-tier model for the optional live diagnostic
        required: false
        default: gemini-3.8-flash
        type: choice
        options:
          - gemini-3.8-flash
          - gemini-3.6-flash
  workflow_call:
    inputs:
      ref:
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  maintenance-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.maintenance_smoke && github.repository == 'djsydney04/prism'
    name: Maintenance agent live smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm install --global @google/gemini-cli@0.65.0
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: rustup component add rustfmt clippy
      - name: Exercise real inference, editing and iterative Rust checks
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMOKE_MODEL: ${{ inputs.maintenance_smoke_model }}
        run: python3 scripts/sdk-maintenance.py smoke --artifacts "$RUNNER_TEMP/smoke"
  checks:
    if: ${{ !inputs.maintenance_smoke }}
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
  msrv:
    if: ${{ !inputs.maintenance_smoke }}
    name: Rust 1.88 minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --workspace --all-targets --locked
  package:
    if: ${{ !inputs.maintenance_smoke }}
    name: Verify crate packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: python3 scripts/verify-packages.py
  audit:
    if: ${{ !inputs.maintenance_smoke }}
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
  release-tooling:
    if: ${{ !inputs.maintenance_smoke }}
    name: Release tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Historical SDK tags may predate these tests; validate the publisher itself.
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/tests -v
