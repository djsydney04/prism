name: Maintenance diagnostic
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Model provider for the disposable repair test
        type: choice
        default: groq
        options: [groq, google, openai, anthropic]
      model:
        description: Optional model ID; Groq defaults to openai/gpt-oss-120b
        type: string
        default: ''
      allow_paid:
        description: Explicitly allow paid inference for this diagnostic
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  repair:
    uses: djsydney04/repo_maintainer/.github/workflows/smoke.yml@610da64180574028e70273ce55b7495fb7908b41
    with:
      maintainer_ref: 610da64180574028e70273ce55b7495fb7908b41
      provider: ${{ inputs.provider }}
      model: ${{ inputs.model || (inputs.provider == 'groq' && 'openai/gpt-oss-120b') || '' }}
      allow_paid: ${{ inputs.allow_paid }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SDK_MAINTENANCE_API_KEY: ${{ secrets.SDK_MAINTENANCE_API_KEY }}
