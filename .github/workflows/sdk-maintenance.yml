name: Weekly SDK maintenance
on:
  schedule:
    - cron: '0 9 * * 1'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      provider:
        description: Optional provider override (google or groq)
        type: string
        default: ''
      model:
        description: Optional model override
        type: string
        default: ''
permissions:
  contents: read
jobs:
  maintain:
    if: github.repository == 'djsydney04/prism' && github.ref_name == github.event.repository.default_branch
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    uses: djsydney04/repo_maintainer/.github/workflows/maintain.yml@5e050beb60a575e7a5e5d7aa20efa146df6feda1
    with:
      maintainer_ref: 5e050beb60a575e7a5e5d7aa20efa146df6feda1
      owner: djsydney04
      provider: ${{ inputs.provider || vars.SDK_MAINTENANCE_PROVIDER || 'google' }}
      model: ${{ inputs.model || vars.SDK_MAINTENANCE_MODEL }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SDK_MAINTENANCE_API_KEY: ${{ secrets.SDK_MAINTENANCE_API_KEY }}
